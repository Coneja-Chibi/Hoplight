name: release

# Tag-triggered releases: push a tag like v0.1.0 and this builds the desktop exe (Windows), the CLI
# binaries for four targets (the same bake, so `hoplight ui` serves the packaged studio anywhere),
# checksums everything, and publishes a GitHub Release. The tag must match package.json's version.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json version
        run: |
          PKG="v$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG" != "$TAG" ]; then
            echo "tag $TAG does not match package.json $PKG" >&2
            exit 1
          fi
      - run: bun run verify:ci

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build Hoplight.exe + Windows CLI
        run: bun run scripts/build-desktop.ts --cli-targets=bun-windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Hoplight.exe
            dist/hoplight-windows-x64.exe
          if-no-files-found: error

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build Linux CLI
        run: bun run scripts/build-desktop.ts --no-desktop --cli-targets=bun-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/hoplight-linux-x64
          if-no-files-found: error

  build-macos:
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build macOS CLIs (arm64 + x64)
        run: bun run scripts/build-desktop.ts --no-desktop --cli-targets=bun-darwin-arm64,bun-darwin-x64
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/hoplight-darwin-arm64
            dist/hoplight-darwin-x64
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum Hoplight.exe hoplight-windows-x64.exe hoplight-linux-x64 hoplight-darwin-arm64 hoplight-darwin-x64 > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Hoplight ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/Hoplight.exe \
            dist/hoplight-windows-x64.exe \
            dist/hoplight-linux-x64 \
            dist/hoplight-darwin-arm64 \
            dist/hoplight-darwin-x64 \
            dist/SHA256SUMS
