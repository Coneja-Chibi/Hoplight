<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 996" width="660" height="996" role="img" aria-label="CharacterBody, grouped"><style>text{font-family:ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#1a1712}.h{font-size:13px;font-weight:700;letter-spacing:.02em}.n{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.08em}.l{font-size:12.5px;font-weight:650}.s{font-size:11px;fill:#8a8270}.c{font-size:11px;fill:#8a8270}.th{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.04em}</style><rect x="1" y="1" width="658" height="994" rx="10" fill="#faf8f3" stroke="#e6e0d4"/><line x1="20" y1="42" x2="640" y2="42" stroke="#e6e0d4"/><text x="20" y="30" class="n">FIG 01</text><text x="72" y="30" class="h">CharacterBody, grouped</text><circle cx="25" cy="68" r="4" fill="#1a1712"/><text x="36" y="72" class="l">CharacterBody</text><text x="139" y="72" class="s">The canonical character superset. Eight required sub-objects</text><path d="M 25 88 L 25 99 L 39 99" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="98" r="4" fill="#4E8C9E"/><text x="58" y="102" class="l">identity</text><text x="126" y="102" class="s">Who the character is: name plus authored identity scalars</text><path d="M 25 118 L 25 129 L 39 129" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="128" r="4" fill="#4E8C9E"/><text x="58" y="132" class="l">persona</text><text x="119" y="132" class="s">How the character behaves, sounds, and looks. Scalars:</text><path d="M 47 148 L 47 159 L 61 159" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="158" r="4" fill="#8A6BA8"/><text x="80" y="162" class="l">voice: Voice</text><text x="176" y="162" class="s">TTS selection and config, never the audio bytes.</text><path d="M 47 178 L 47 189 L 61 189" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="188" r="4" fill="#8A6BA8"/><text x="80" y="192" class="l">imagePrompt: ImagePrompt</text><text x="260" y="192" class="s">Authored image-gen prompt hints.</text><path d="M 47 208 L 47 219 L 61 219" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="218" r="4" fill="#8A6BA8"/><text x="80" y="222" class="l">structured: union</text><text x="211" y="222" class="s">Structured persona encoding (text or attribute-map kinds).</text><path d="M 25 238 L 25 249 L 39 249" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="248" r="4" fill="#4E8C9E"/><text x="58" y="252" class="l">prompts</text><text x="119" y="252" class="s">Instruction-layer text. Scalars: systemPrompt,</text><path d="M 47 268 L 47 279 L 61 279" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="278" r="4" fill="#8A6BA8"/><text x="80" y="282" class="l">depthInjections: DepthInjection[]</text><text x="300" y="282" class="s">Text injected at a fixed depth.</text><path d="M 25 298 L 25 309 L 39 309" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="308" r="4" fill="#4E8C9E"/><text x="58" y="312" class="l">greetings</text><text x="133" y="312" class="s">The opening messages. Scalar: firstMessage.</text><path d="M 47 328 L 47 339 L 61 339" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="338" r="4" fill="#8A6BA8"/><text x="80" y="342" class="l">alternateGreetings: Greeting[]</text><text x="300" y="342" class="s">Swipeable alternate openings.</text><path d="M 47 358 L 47 369 L 61 369" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="368" r="4" fill="#8A6BA8"/><text x="80" y="372" class="l">groupOnlyGreetings: Greeting[]</text><text x="300" y="372" class="s">CCv3 group-chat-only greetings.</text><path d="M 25 388 L 25 399 L 39 399" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="398" r="4" fill="#4E8C9E"/><text x="58" y="402" class="l">examples</text><text x="126" y="402" class="s">Example dialogue. Scalar: exampleMessages.</text><path d="M 25 418 L 25 429 L 39 429" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="428" r="4" fill="#4E8C9E"/><text x="58" y="432" class="l">media</text><text x="105" y="432" class="s">Images and the composite-avatar recipe. Scalars: visualKind,</text><path d="M 47 448 L 47 459 L 61 459" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="458" r="4" fill="#8A6BA8"/><text x="80" y="462" class="l">portrait: MediaAsset</text><text x="232" y="462" class="s">The primary portrait.</text><path d="M 47 478 L 47 489 L 61 489" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="488" r="4" fill="#8A6BA8"/><text x="80" y="492" class="l">assets: MediaAsset[]</text><text x="232" y="492" class="s">Expression, outfit, and pose packs.</text><path d="M 47 508 L 47 519 L 61 519" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="518" r="4" fill="#8A6BA8"/><text x="80" y="522" class="l">sprite: Sprite</text><text x="190" y="522" class="s">Agnai composite-avatar recipe.</text><path d="M 25 538 L 25 549 L 39 549" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="548" r="4" fill="#4E8C9E"/><text x="58" y="552" class="l">attribution</text><text x="147" y="552" class="s">Credit and provenance: creator, originalCreator, source,</text><path d="M 25 568 L 25 579 L 39 579" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="578" r="4" fill="#4E8C9E"/><text x="58" y="582" class="l">discovery</text><text x="133" y="582" class="s">How the card is found: tags, genre, fandom, rating,</text><path d="M 25 598 L 25 609 L 39 609" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="608" r="4" fill="#5C9472"/><text x="58" y="612" class="l">presentation?</text><text x="161" y="612" class="s">The casting-card visual identity. Scalars: signatureColor,</text><path d="M 47 628 L 47 639 L 61 639" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="638" r="4" fill="#8A6BA8"/><text x="80" y="642" class="l">palette: Swatch[]</text><text x="211" y="642" class="s">Named color swatches.</text><path d="M 47 658 L 47 669 L 61 669" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="668" r="4" fill="#8A6BA8"/><text x="80" y="672" class="l">background: Background</text><text x="246" y="672" class="s">Curated background, possibly a video.</text><path d="M 25 688 L 25 699 L 39 699" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="698" r="4" fill="#5C9472"/><text x="58" y="702" class="l">settings?</text><text x="133" y="702" class="s">Authored inline dials. Scalars: talkativeness, risu toggles,</text><path d="M 25 718 L 25 729 L 39 729" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="728" r="4" fill="#5C9472"/><text x="58" y="732" class="l">behavior?</text><text x="133" y="732" class="s">Authored on-card behavior, modeled but never executed by the</text><path d="M 47 748 L 47 759 L 61 759" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="758" r="4" fill="#8A6BA8"/><text x="80" y="762" class="l">regexScripts: RegexScript[]</text><text x="281" y="762" class="s">Card-embedded find/replace twins (see regex.md).</text><path d="M 47 778 L 47 789 L 61 789" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="788" r="4" fill="#8A6BA8"/><text x="80" y="792" class="l">triggerScripts: TriggerScript[]</text><text x="300" y="792" class="s">Trigger state-machine rows.</text><path d="M 25 808 L 25 819 L 39 819" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="818" r="4" fill="#CC9A47"/><text x="58" y="822" class="l">bias?</text><text x="105" y="822" class="s">Character-level phrase/logit bias pairs.</text><path d="M 25 838 L 25 849 L 39 849" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="848" r="4" fill="#CC9A47"/><text x="58" y="852" class="l">worldName?</text><text x="140" y="852" class="s">External worldbook link by name (distinct from</text><path d="M 25 868 L 25 879 L 39 879" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="878" r="4" fill="#CC9A47"/><text x="58" y="882" class="l">knowledgeRefs?</text><text x="168" y="882" class="s">Ordered ids of linked canonical lorebooks.</text><path d="M 25 898 L 25 909 L 39 909" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="908" r="4" fill="#CC9A47"/><text x="58" y="912" class="l">behaviorRefs?</text><text x="161" y="912" class="s">Ordered ids of linked standalone regex/script entities.</text><path d="M 25 928 L 25 939 L 39 939" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="938" r="4" fill="#CC9A47"/><text x="58" y="942" class="l">variants?</text><text x="133" y="942" class="s">Alternate versions of this character.</text><path d="M 47 958 L 47 969 L 61 969" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="968" r="4" fill="#8A6BA8"/><text x="80" y="972" class="l">CharacterVariant</text><text x="204" y="972" class="s">id, label, mirrorBase, overrides (a deep partial of the</text></svg>
