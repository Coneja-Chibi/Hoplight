<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 200" width="510" height="200" role="img" aria-label="one draft, three views"><style>text{font-family:ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#1a1712}.h{font-size:13px;font-weight:700;letter-spacing:.02em}.n{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.08em}.l{font-size:12.5px;font-weight:650}.s{font-size:11px;fill:#8a8270}.c{font-size:11px;fill:#8a8270}.th{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.04em}</style><rect x="1" y="1" width="508" height="198" rx="10" fill="#faf8f3" stroke="#e6e0d4"/><line x1="20" y1="42" x2="490" y2="42" stroke="#e6e0d4"/><text x="20" y="30" class="n">FIG 01</text><text x="72" y="30" class="h">one draft, three views</text><rect x="20" y="52" width="470" height="136" rx="6" fill="#ffffff" stroke="#e6e0d4"/><text x="200" y="74" class="th">Shows</text><text x="350" y="74" class="th">Best when</text><line x1="20" y1="86" x2="490" y2="86" stroke="#e6e0d4"/><text x="30" y="107" class="l">Steps</text><text x="200" y="107" class="s">one field at a time,</text><text x="200" y="120" class="s">guided</text><text x="350" y="107" class="s">starting a piece</text><text x="350" y="120" class="s">from nothing</text><line x1="20" y1="120" x2="490" y2="120" stroke="#e6e0d4"/><text x="30" y="141" class="l">Bento</text><text x="200" y="141" class="s">every field in one</text><text x="200" y="154" class="s">card grid</text><text x="350" y="141" class="s">you know the card</text><text x="350" y="154" class="s">and want it all at …</text><line x1="20" y1="154" x2="490" y2="154" stroke="#e6e0d4"/><text x="30" y="175" class="l">Playbill</text><text x="200" y="175" class="s">fields grouped into</text><text x="200" y="188" class="s">acts you page throu…</text><text x="350" y="175" class="s">a long card, scanned</text><text x="350" y="188" class="s">section by section</text><line x1="190" y1="52" x2="190" y2="188" stroke="#e6e0d4"/></svg>
