<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 756" width="660" height="756" role="img" aria-label="LorebookBody, grouped"><style>text{font-family:ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#1a1712}.h{font-size:13px;font-weight:700;letter-spacing:.02em}.n{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.08em}.l{font-size:12.5px;font-weight:650}.s{font-size:11px;fill:#8a8270}.c{font-size:11px;fill:#8a8270}.th{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.04em}</style><rect x="1" y="1" width="658" height="754" rx="10" fill="#faf8f3" stroke="#e6e0d4"/><line x1="20" y1="42" x2="640" y2="42" stroke="#e6e0d4"/><text x="20" y="30" class="n">FIG 01</text><text x="72" y="30" class="h">LorebookBody, grouped</text><circle cx="25" cy="68" r="4" fill="#1a1712"/><text x="36" y="72" class="l">LorebookBody</text><text x="132" y="72" class="s">The canonical lorebook superset. Book-level settings plus</text><path d="M 25 88 L 25 99 L 39 99" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="98" r="4" fill="#4E8C9E"/><text x="58" y="102" class="l">identity and categorization</text><text x="259" y="102" class="s">name, description, lorebookType, genre, fandom, tags.</text><path d="M 25 118 L 25 129 L 39 129" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="128" r="4" fill="#4E8C9E"/><text x="58" y="132" class="l">matching defaults</text><text x="189" y="132" class="s">globalCaseSensitive, globalMatchWholeWords, globalScanDepth,</text><path d="M 25 148 L 25 159 L 39 159" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="158" r="4" fill="#4E8C9E"/><text x="58" y="162" class="l">budget</text><text x="112" y="162" class="s">tokenBudget, budgetMode, entryBudget: how much of the book</text><path d="M 25 178 L 25 189 L 39 189" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="188" r="4" fill="#5C9472"/><text x="58" y="192" class="l">enabled?</text><text x="126" y="192" class="s">Book-level on/off for the shelf and Press export filter</text><path d="M 25 208 L 25 219 L 39 219" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="218" r="4" fill="#8A6BA8"/><text x="58" y="222" class="l">entries: LorebookEntry[]</text><text x="238" y="222" class="s">The triggerable content. One flat interface in the schema;</text><path d="M 47 238 L 47 249 L 61 249" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="248" r="4" fill="#4E8C9E"/><text x="80" y="252" class="l">identity and content</text><text x="232" y="252" class="s">id, title, content, comment, enabled, constant.</text><path d="M 47 268 L 47 279 L 61 279" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="278" r="4" fill="#4E8C9E"/><text x="80" y="282" class="l">triggers and matching</text><text x="239" y="282" class="s">triggerMode, triggers, secondaryTriggers, selectiveLogic,</text><path d="M 69 298 L 69 309 L 83 309" stroke="#e6e0d4" fill="none"/><circle cx="91" cy="308" r="4" fill="#8A6BA8"/><text x="102" y="312" class="l">Trigger</text><text x="163" y="312" class="s">keyword, isRegex, flags, frequency, probability.</text><path d="M 47 328 L 47 339 L 61 339" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="338" r="4" fill="#4E8C9E"/><text x="80" y="342" class="l">injection and placement</text><text x="253" y="342" class="s">position, depth, role.</text><path d="M 47 358 L 47 369 L 61 369" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="368" r="4" fill="#4E8C9E"/><text x="80" y="372" class="l">ordering, timing, grouping</text><text x="274" y="372" class="s">sortOrder, priority, sticky, cooldown, delay, groupName,</text><path d="M 47 388 L 47 399 L 61 399" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="398" r="4" fill="#4E8C9E"/><text x="80" y="402" class="l">recursion and budget</text><text x="232" y="402" class="s">useMemo, excludeRecursion, preventRecursion,</text><path d="M 47 418 L 47 429 L 61 429" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="428" r="4" fill="#4E8C9E"/><text x="80" y="432" class="l">scan sources</text><text x="176" y="432" class="s">scanCharacterDescription, scanCharacterPersonality,</text><path d="M 47 448 L 47 459 L 61 459" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="458" r="4" fill="#4E8C9E"/><text x="80" y="462" class="l">filters and side effects</text><text x="260" y="462" class="s">characterFilter, sideEffects.</text><path d="M 69 478 L 69 489 L 83 489" stroke="#e6e0d4" fill="none"/><circle cx="91" cy="488" r="4" fill="#8A6BA8"/><text x="102" y="492" class="l">CharacterFilter</text><text x="219" y="492" class="s">names, tags, isExclude.</text><path d="M 69 508 L 69 519 L 83 519" stroke="#e6e0d4" fill="none"/><circle cx="91" cy="518" r="4" fill="#8A6BA8"/><text x="102" y="522" class="l">EntrySideEffects</text><text x="226" y="522" class="s">effects: EntrySideEffect[], onlyOnFirstTrigger,</text><path d="M 47 538 L 47 549 L 61 549" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="548" r="4" fill="#4E8C9E"/><text x="80" y="552" class="l">ST-lineage toggles</text><text x="218" y="552" class="s">vectorized, groupOverride, useGroupScoring, automationId,</text><path d="M 47 568 L 47 579 L 61 579" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="578" r="4" fill="#4E8C9E"/><text x="80" y="582" class="l">NovelAI extensions</text><text x="218" y="582" class="s">keyRelative, nonStoryActivatable, contextConfig,</text><path d="M 69 598 L 69 609 L 83 609" stroke="#e6e0d4" fill="none"/><circle cx="91" cy="608" r="4" fill="#8A6BA8"/><text x="102" y="612" class="l">EntryContextConfig</text><text x="240" y="612" class="s">prefix, suffix, tokenBudget, reservedTokens, trimDirection,</text><path d="M 69 628 L 69 639 L 83 639" stroke="#e6e0d4" fill="none"/><circle cx="91" cy="638" r="4" fill="#8A6BA8"/><text x="102" y="642" class="l">LoreBiasGroup</text><text x="205" y="642" class="s">enabled, bias, phrases: LoreBiasPhrase[], whenInactive,</text><path d="M 47 658 L 47 669 L 61 669" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="668" r="4" fill="#CC9A47"/><text x="80" y="672" class="l">metadata?</text><text x="155" y="672" class="s">Open bag for format-specific data with no first-class home.</text><path d="M 25 688 L 25 699 L 39 699" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="698" r="4" fill="#5C9472"/><text x="58" y="702" class="l">categories?: LorebookCategory[]</text><text x="278" y="702" class="s">Optional named folders grouping entries.</text><path d="M 47 718 L 47 729 L 61 729" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="728" r="4" fill="#8A6BA8"/><text x="80" y="732" class="l">LorebookCategory</text><text x="204" y="732" class="s">id, name, sortOrder, enabled?.</text></svg>
