<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 336" width="660" height="336" role="img" aria-label="PackBody, grouped"><style>text{font-family:ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#1a1712}.h{font-size:13px;font-weight:700;letter-spacing:.02em}.n{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.08em}.l{font-size:12.5px;font-weight:650}.s{font-size:11px;fill:#8a8270}.c{font-size:11px;fill:#8a8270}.th{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.04em}</style><rect x="1" y="1" width="658" height="334" rx="10" fill="#faf8f3" stroke="#e6e0d4"/><line x1="20" y1="42" x2="640" y2="42" stroke="#e6e0d4"/><text x="20" y="30" class="n">FIG 01</text><text x="72" y="30" class="h">PackBody, grouped</text><circle cx="25" cy="68" r="4" fill="#1a1712"/><text x="36" y="72" class="l">PackBody</text><text x="104" y="72" class="s">The canonical pack body. One small flat record, no</text><path d="M 25 88 L 25 99 L 39 99" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="98" r="4" fill="#CC9A47"/><text x="58" y="102" class="l">name</text><text x="98" y="102" class="s">Library / tab name.</text><path d="M 25 118 L 25 129 L 39 129" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="128" r="4" fill="#5C9472"/><text x="58" y="132" class="l">brief?</text><text x="112" y="132" class="s">Short blurb on the shelf card. Never reaches a host wire:</text><path d="M 25 148 L 25 159 L 39 159" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="158" r="4" fill="#4E8C9E"/><text x="58" y="162" class="l">pack</text><text x="98" y="162" class="s">The emotion pack: label to image. The hub shape shared with</text><path d="M 47 178 L 47 189 L 61 189" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="188" r="4" fill="#8A6BA8"/><text x="80" y="192" class="l">items: SpritePackItem[]</text><text x="253" y="192" class="s">id, label, ref, mime?. One face per item.</text><path d="M 47 208 L 47 219 L 61 219" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="218" r="4" fill="#CC9A47"/><text x="80" y="222" class="l">enabled?: boolean</text><text x="211" y="222" class="s">Creator on/off toggle for the pack as a whole.</text><path d="M 47 238 L 47 249 L 61 249" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="248" r="4" fill="#CC9A47"/><text x="80" y="252" class="l">defaultLabel?: string</text><text x="239" y="252" class="s">Which face is the resting/default face.</text><path d="M 25 268 L 25 279 L 39 279" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="278" r="4" fill="#5C9472"/><text x="58" y="282" class="l">groups?</text><text x="119" y="282" class="s">Multi-character groups (Lumi-style): member name to</text><path d="M 47 298 L 47 309 L 61 309" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="308" r="4" fill="#8A6BA8"/><text x="80" y="312" class="l">Record&lt;string, SpritePackValue&gt;</text><text x="300" y="312" class="s">One full pack per group member, keyed by that member's name.</text></svg>
