<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 696" width="660" height="696" role="img" aria-label="PersonaBody, grouped"><style>text{font-family:ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#1a1712}.h{font-size:13px;font-weight:700;letter-spacing:.02em}.n{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.08em}.l{font-size:12.5px;font-weight:650}.s{font-size:11px;fill:#8a8270}.c{font-size:11px;fill:#8a8270}.th{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.04em}</style><rect x="1" y="1" width="658" height="694" rx="10" fill="#faf8f3" stroke="#e6e0d4"/><line x1="20" y1="42" x2="640" y2="42" stroke="#e6e0d4"/><text x="20" y="30" class="n">FIG 01</text><text x="72" y="30" class="h">PersonaBody, grouped</text><circle cx="25" cy="68" r="4" fill="#1a1712"/><text x="36" y="72" class="l">PersonaBody</text><text x="125" y="72" class="s">The canonical persona superset: the USER's identity, first</text><path d="M 25 88 L 25 99 L 39 99" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="98" r="4" fill="#CC9A47"/><text x="58" y="102" class="l">name</text><text x="98" y="102" class="s">The persona's canonical name.</text><path d="M 25 118 L 25 129 L 39 129" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="128" r="4" fill="#CC9A47"/><text x="58" y="132" class="l">brief?</text><text x="112" y="132" class="s">Short library-card summary. Never the injected text.</text><path d="M 25 148 L 25 159 L 39 159" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="158" r="4" fill="#CC9A47"/><text x="58" y="162" class="l">content</text><text x="119" y="162" class="s">The full first-person text injected as {{user}}'s voice.</text><path d="M 25 178 L 25 189 L 39 189" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="188" r="4" fill="#5C9472"/><text x="58" y="192" class="l">sections?</text><text x="133" y="192" class="s">Structured alternative source for content: appearance, body,</text><path d="M 47 208 L 47 219 L 61 219" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="218" r="4" fill="#8A6BA8"/><text x="80" y="222" class="l">PersonaSections</text><text x="197" y="222" class="s">Five optional section fields, compiled into content in fixed</text><path d="M 25 238 L 25 249 L 39 249" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="248" r="4" fill="#CC9A47"/><text x="58" y="252" class="l">sectionOrder?</text><text x="161" y="252" class="s">Creator-chosen display order of sections.</text><path d="M 25 268 L 25 279 L 39 279" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="278" r="4" fill="#CC9A47"/><text x="58" y="282" class="l">traits?</text><text x="119" y="282" class="s">Personality-descriptor traits (RC details.traits / card</text><path d="M 25 298 L 25 309 L 39 309" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="308" r="4" fill="#5C9472"/><text x="58" y="312" class="l">identity?</text><text x="133" y="312" class="s">Authored identity attributes: tagline, age, height,</text><path d="M 47 328 L 47 339 L 61 339" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="338" r="4" fill="#8A6BA8"/><text x="80" y="342" class="l">PersonaIdentity</text><text x="197" y="342" class="s">tagline, age (free text), height, pronouns, and the</text><path d="M 47 358 L 47 369 L 61 369" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="368" r="4" fill="#8A6BA8"/><text x="80" y="372" class="l">PersonaPronounSet</text><text x="211" y="372" class="s">subjective/objective/possessive: real data an engine can</text><path d="M 25 388 L 25 399 L 39 399" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="398" r="4" fill="#5C9472"/><text x="58" y="402" class="l">presentation?</text><text x="161" y="402" class="s">The persona's visual identity (RC theming).</text><path d="M 47 418 L 47 429 L 61 429" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="428" r="4" fill="#8A6BA8"/><text x="80" y="432" class="l">PersonaPresentation</text><text x="225" y="432" class="s">signatureColor, colors (Swatch[]), imageUrl.</text><path d="M 25 448 L 25 459 L 39 459" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="458" r="4" fill="#CC9A47"/><text x="58" y="462" class="l">knowledgeRefs?</text><text x="168" y="462" class="s">Ordered ids of linked canonical lorebooks.</text><path d="M 25 478 L 25 489 L 39 489" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="488" r="4" fill="#CC9A47"/><text x="58" y="492" class="l">rating?</text><text x="119" y="492" class="s">Explicit content rating, reusing the canonical</text><path d="M 25 508 L 25 519 L 39 519" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="518" r="4" fill="#5C9472"/><text x="58" y="522" class="l">chatInjection?</text><text x="168" y="522" class="s">Where and how the content is injected into the prompt.</text><path d="M 47 538 L 47 549 L 61 549" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="548" r="4" fill="#8A6BA8"/><text x="80" y="552" class="l">PersonaChatInjection</text><text x="232" y="552" class="s">position (RC's four stops or ST's five), depth, role,</text><path d="M 25 568 L 25 579 L 39 579" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="578" r="4" fill="#5C9472"/><text x="58" y="582" class="l">attribution?</text><text x="154" y="582" class="s">Credit and provenance.</text><path d="M 47 598 L 47 609 L 61 609" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="608" r="4" fill="#8A6BA8"/><text x="80" y="612" class="l">PersonaAttribution</text><text x="218" y="612" class="s">creator, version, createdAt, source.</text><path d="M 25 628 L 25 639 L 39 639" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="638" r="4" fill="#5C9472"/><text x="58" y="642" class="l">media?</text><text x="112" y="642" class="s">Studio-side portrait slot.</text><path d="M 47 658 L 47 669 L 61 669" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="668" r="4" fill="#8A6BA8"/><text x="80" y="672" class="l">MediaAsset</text><text x="162" y="672" class="s">Same shape as CharacterBody.media.portrait; see</text></svg>
