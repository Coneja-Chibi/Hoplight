<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 516" width="660" height="516" role="img" aria-label="PresetBody, grouped"><style>text{font-family:ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#1a1712}.h{font-size:13px;font-weight:700;letter-spacing:.02em}.n{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.08em}.l{font-size:12.5px;font-weight:650}.s{font-size:11px;fill:#8a8270}.c{font-size:11px;fill:#8a8270}.th{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.04em}</style><rect x="1" y="1" width="658" height="514" rx="10" fill="#faf8f3" stroke="#e6e0d4"/><line x1="20" y1="42" x2="640" y2="42" stroke="#e6e0d4"/><text x="20" y="30" class="n">FIG 01</text><text x="72" y="30" class="h">PresetBody, grouped</text><circle cx="25" cy="68" r="4" fill="#1a1712"/><text x="36" y="72" class="l">PresetBody</text><text x="118" y="72" class="s">The canonical preset superset. Two required fields plus</text><path d="M 25 88 L 25 99 L 39 99" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="98" r="4" fill="#CC9A47"/><text x="58" y="102" class="l">name</text><text x="98" y="102" class="s">The preset's name.</text><path d="M 25 118 L 25 129 L 39 129" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="128" r="4" fill="#CC9A47"/><text x="58" y="132" class="l">description?</text><text x="154" y="132" class="s">Free-text description.</text><path d="M 25 148 L 25 159 L 39 159" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="158" r="4" fill="#CC9A47"/><text x="58" y="162" class="l">enabled?</text><text x="126" y="162" class="s">Set-level on/off (the Library shelf switch); absent = on.</text><path d="M 25 178 L 25 189 L 39 189" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="188" r="4" fill="#4E8C9E"/><text x="58" y="192" class="l">prompts</text><text x="119" y="192" class="s">The ordered real prompt blocks (PresetPrompt[]): the</text><path d="M 25 208 L 25 219 L 39 219" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="218" r="4" fill="#5C9472"/><text x="58" y="222" class="l">groups?</text><text x="119" y="222" class="s">Categories/folders for prompts (PresetGroup[]). Scalars: id,</text><path d="M 25 238 L 25 249 L 39 249" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="248" r="4" fill="#5C9472"/><text x="58" y="252" class="l">samplers?</text><text x="133" y="252" class="s">Sampler and context-window settings, all scalar:</text><path d="M 25 268 L 25 279 L 39 279" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="278" r="4" fill="#5C9472"/><text x="58" y="282" class="l">systemPrompts?</text><text x="168" y="282" class="s">The always-on utility prompts: impersonation, newChat,</text><path d="M 25 298 L 25 309 L 39 309" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="308" r="4" fill="#5C9472"/><text x="58" y="312" class="l">templates?</text><text x="140" y="312" class="s">Handlebars-ish format strings for card fields:</text><path d="M 25 328 L 25 339 L 39 339" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="338" r="4" fill="#5C9472"/><text x="58" y="342" class="l">behavior?</text><text x="133" y="342" class="s">Message-assembly behavior flags: wrapInQuotes,</text><path d="M 25 358 L 25 369 L 39 369" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="368" r="4" fill="#5C9472"/><text x="58" y="372" class="l">apiOptions?</text><text x="147" y="372" class="s">Provider/API request options: streamResponses,</text><path d="M 25 388 L 25 399 L 39 399" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="398" r="4" fill="#5C9472"/><text x="58" y="402" class="l">media?</text><text x="112" y="402" class="s">Image/video inlining: imageInlining, inlineImageQuality,</text><path d="M 25 418 L 25 429 L 39 429" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="428" r="4" fill="#5C9472"/><text x="58" y="432" class="l">generation?</text><text x="147" y="432" class="s">Generation-shape settings: seed, completions,</text><path d="M 25 448 L 25 459 L 39 459" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="458" r="4" fill="#5C9472"/><text x="58" y="462" class="l">choices?</text><text x="126" y="462" class="s">The CHOICES walkthrough (PresetChoice[]): authored now, run</text><path d="M 47 478 L 47 489 L 61 489" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="488" r="4" fill="#8A6BA8"/><text x="80" y="492" class="l">options: PresetChoiceOption[]</text><text x="295" y="492" class="s">One answerable option: id, label, description, value,</text></svg>
