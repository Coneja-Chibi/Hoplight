<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 396" width="660" height="396" role="img" aria-label="why an import didn't land the way you expected"><style>text{font-family:ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#1a1712}.h{font-size:13px;font-weight:700;letter-spacing:.02em}.n{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.08em}.l{font-size:12.5px;font-weight:650}.s{font-size:11px;fill:#8a8270}.c{font-size:11px;fill:#8a8270}.th{font-size:11px;font-weight:700;fill:#8a8270;letter-spacing:.04em}</style><rect x="1" y="1" width="658" height="394" rx="10" fill="#faf8f3" stroke="#e6e0d4"/><line x1="20" y1="42" x2="640" y2="42" stroke="#e6e0d4"/><text x="20" y="30" class="n">FIG 01</text><text x="72" y="30" class="h">why an import didn't land the way you expected</text><circle cx="25" cy="68" r="4" fill="#1a1712"/><text x="36" y="72" class="l">Import didn't do what you expected</text><text x="256" y="72" class="s">Start with the receipt. It already states which of the three</text><path d="M 25 88 L 25 99 L 39 99" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="98" r="4" fill="#4E8C9E"/><text x="58" y="102" class="l">It would not read at all</text><text x="238" y="102" class="s">&quot;We could not read this one.&quot; A format question, not a</text><path d="M 47 118 L 47 129 L 61 129" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="128" r="4" fill="#CC9A47"/><text x="80" y="132" class="l">Unrecognized format</text><text x="225" y="132" class="s">Not a card, book, or persona shape Hoplight knows yet. Check</text><path d="M 47 148 L 47 159 L 61 159" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="158" r="4" fill="#CC9A47"/><text x="80" y="162" class="l">Right shape, wrong kind guess</text><text x="295" y="162" class="s">Run hoplight label to see what Hoplight thinks the file is</text><path d="M 25 178 L 25 189 L 39 189" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="188" r="4" fill="#4E8C9E"/><text x="58" y="192" class="l">It landed, but not once</text><text x="231" y="192" class="s">Importing never overwrites, so a repeat drop always makes a</text><path d="M 47 208 L 47 219 L 61 219" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="218" r="4" fill="#CC9A47"/><text x="80" y="222" class="l">The same file, dropped twice</text><text x="288" y="222" class="s">The second copy gets -2 tacked onto its id, on purpose.</text><path d="M 47 238 L 47 249 L 61 249" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="248" r="4" fill="#CC9A47"/><text x="80" y="252" class="l">An embedded lorebook stepped out on its own</text><text x="300" y="252" class="s">One receipt row can still mean two saved pieces: the</text><path d="M 25 268 L 25 279 L 39 279" stroke="#e6e0d4" fill="none"/><circle cx="47" cy="278" r="4" fill="#4E8C9E"/><text x="58" y="282" class="l">It read clean, but something's off</text><text x="278" y="282" class="s">The receipt's extra lines say exactly what changed and why.</text><path d="M 47 298 L 47 309 L 61 309" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="308" r="4" fill="#CC9A47"/><text x="80" y="312" class="l">A lorebook got healed</text><text x="239" y="312" class="s">A missing name or malformed entry is repaired on the way in,</text><path d="M 47 328 L 47 339 L 61 339" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="338" r="4" fill="#CC9A47"/><text x="80" y="342" class="l">Scripts show up as text</text><text x="253" y="342" class="s">Carried as data on purpose; nothing on a card executes just</text><path d="M 47 358 L 47 369 L 61 369" stroke="#e6e0d4" fill="none"/><circle cx="69" cy="368" r="4" fill="#CC9A47"/><text x="80" y="372" class="l">A deep-access request was refused</text><text x="300" y="372" class="s">The card still imports; that one request just doesn't get</text></svg>
